<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parua Local Football League</title>
<style>
*{box-sizing:border-box} html{overflow-x:hidden} body{margin:0;background:#06100d;color:#f4f7f5;font-family:Arial,sans-serif;overflow-x:hidden}
header{background:#050706;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:5}
.brand{min-width:0;font-size:22px;font-weight:800}.brand span{color:#2bd36f}
nav a{color:#ddd;text-decoration:none;margin:0 12px;font-weight:700}nav a:hover{color:#2bd36f}
.container{max-width:1250px;margin:28px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.card{background:linear-gradient(145deg,#0b1b16,#07100e);border:1px solid #1c4a36;border-radius:14px;padding:20px;margin-bottom:18px}
.live-card{background:linear-gradient(145deg,#08243a,#06130f);text-align:center;padding:28px}
.badge{display:inline-block;padding:7px 12px;border-radius:7px;background:#e51f27;color:white;font-weight:800}
.score{font-size:54px;font-weight:900;margin:18px 0 5px}.teams{font-size:22px;font-weight:800}
.clock{font-size:22px;color:#ff3131;font-weight:900}.section-title{font-size:22px;margin:0 0 14px}
.fixture{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #244034;padding:15px 4px}
.fixture:first-of-type{border-top:0}.time{color:#42df78;font-weight:800}.muted{color:#aab8b1}
.button{display:inline-block;background:#159447;color:white;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:800}
footer{border-top:1px solid #19382b;margin-top:30px;padding:20px;text-align:center;color:#aab8b1}
@media(max-width:800px){.grid{grid-template-columns:1fr}nav{display:none}.score{font-size:44px}}
@media(max-width:560px){header{padding:13px 14px}.brand{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.container{width:100%;margin:18px auto;padding:0 12px}.card{padding:16px;border-radius:12px}.live-card{padding:20px 12px}.section-title{font-size:17px}.fixture{gap:9px;padding:13px 0}.fixture strong{min-width:0;font-size:12px;overflow-wrap:anywhere}.fixture .time{font-size:12px;white-space:nowrap}.button{padding:10px 12px;font-size:12px}}
</style>
</head>
<body>
<header>
<div class="brand">⚽ Parua Local <span>Football League</span></div>
<nav><a href="/">HOME</a><a href="#live">LIVE</a><a href="#upcoming">UPCOMING</a><a href="#results">RESULTS</a></nav>
</header>
{% block content %}{% endblock %}
<footer>Parua Green Stadium • Parua Local Football League</footer>
</body>
</html>
